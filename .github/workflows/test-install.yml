name: test-install

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-install-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  KYB_HEALTH_URL: "http://127.0.0.1:9310/healthz"
  KYB_HEALTH_RETRIES: "30"
  KYB_HEALTH_SLEEP_SECONDS: "2"

jobs:
  install-and-verify:
    name: Install kyb from checked-out formula and verify
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Show toolchain and Homebrew configuration
        run: |
          set -euxo pipefail
          sw_vers
          brew --version
          brew --prefix
          brew config

      - name: Assert Apple Silicon runner
        run: |
          set -euo pipefail
          platform="$(uname -s)"
          arch="$(uname -m)"
          echo "runner platform: ${platform} ${arch}"
          if [ "$platform" != "Darwin" ] || [ "$arch" != "arm64" ]; then
            echo "::error::This workflow requires Apple Silicon macOS (Darwin arm64) runner"
            exit 1
          fi

      - name: Prepare Homebrew var directories
        run: |
          set -euxo pipefail
          mkdir -p "$(brew --prefix)/var/log"

      - name: Validate prebuilt formula scan Ruby snippet parses
        run: |
          set -euo pipefail
          cat >/tmp/prebuilt_formula_scan.rb <<'RUBY'
          path = ARGV.fetch(0)
          bad_lines = []
          File.foreach(path).with_index do |raw_line, index|
            line = raw_line.sub(/#.*/, "")
            next if line.strip.empty?
            if line.match?(/^\s*depends_on\s+["'](?:rust|rustup|rustc|cargo)["']/) ||
               line.match?(/^\s*system\s+.*\bcargo\b/)
              bad_lines << (index + 1)
            end
          end
          unless bad_lines.empty?
            $stderr.puts "::error::kyb formula references rust/cargo in executable code; disallowed for prebuilt-only verification"
            $stderr.puts "offending lines: " + bad_lines.join(", ")
            exit 1
          end
          RUBY
          ruby -c /tmp/prebuilt_formula_scan.rb
          rm -f /tmp/prebuilt_formula_scan.rb

      # (1) Verify prebuilt Apple Silicon installation path and install kyb from the checked-out formula.
      - name: Install prebuilt Apple Silicon kyb formula from checkout
        run: |
          set -euxo pipefail
          test -f ./Formula/kyb.rb
          brew tap-new --no-git alex09x/apps
          local_tap="$(brew --repository)/Library/Taps/alex09x/homebrew-apps"
          mkdir -p "$local_tap/Formula"
          cp "$GITHUB_WORKSPACE/Formula/kyb.rb" "$local_tap/Formula/kyb.rb"
          brew trust alex09x/apps
          echo "Inspecting formula for rust/cargo usage"
          ruby -e '
            path = ARGV.fetch(0)
            bad_lines = []
            File.foreach(path).with_index do |raw_line, index|
              line = raw_line.sub(/#.*/, "")
              next if line.strip.empty?
              if line.match?(/^\s*depends_on\s+["'"'"'](?:rust|rustup|rustc|cargo)["'"'"']/) ||
                 line.match?(/^\s*system\s+.*\bcargo\b/)
                bad_lines << (index + 1)
              end
            end
            unless bad_lines.empty?
              $stderr.puts "::error::kyb formula references rust/cargo in executable code; disallowed for prebuilt-only verification"
              $stderr.puts "offending lines: " + bad_lines.join(", ")
              exit 1
            end
          ' "$local_tap/Formula/kyb.rb"
          if brew deps --include-build --full-name alex09x/apps/kyb | grep -Eq '^rust(@|$)'; then
            echo "::error::kyb formula references rust/cargo which is incompatible with the prebuilt-only assertion"
            exit 1
          fi
          brew install --formula --verbose alex09x/apps/kyb

      - name: Show kyb post-install diagnostic
        if: always()
        run: |
          set +e
          log_file="$(brew --prefix)/var/log/kyb-postinstall.log"
          echo "--- ${log_file} ---"
          if [ -f "$log_file" ]; then
            cat "$log_file"
          else
            echo "no kyb post-install log at ${log_file}"
          fi
          echo "--- runner home candidates ---"
          printf 'shell HOME=%s\n' "$HOME"
          find "$HOME" -maxdepth 5 -path '*/kyb/SKILL.md' -print 2>/dev/null

      - name: Show installed formula info
        run: |
          set -euxo pipefail
          brew list --versions kyb
          brew info kyb || true
          command -v kyb

      # (2) The binary must run.
      - name: Verify kyb --help exits 0
        run: |
          set -euo pipefail
          kyb --help
          echo "kyb --help exited 0"

      # (3) The launchd service must start and be reported as started.
      - name: Start kyb service via brew services
        run: |
          set -euo pipefail
          brew services start kyb

      - name: Verify brew services list shows kyb started
        run: |
          set -euo pipefail
          brew services list
          status="$(brew services list --json | ruby -rjson -e '
            services = JSON.parse(STDIN.read)
            service = services.find { |entry| entry["name"] == "kyb" }
            puts(service ? service.fetch("status", "") : "")
          ')"
          echo "brew services reports kyb status: '${status:-<missing>}'"
          if [ "${status:-}" != "started" ]; then
            echo "::error::brew services does not report kyb as started (got '${status:-<missing>}')"
            exit 1
          fi

      # (4) Health endpoint must answer within a bounded number of retries.
      - name: Wait for kyb healthz endpoint (bounded retries)
        run: |
          set -euo pipefail
          retries="${KYB_HEALTH_RETRIES}"
          sleep_seconds="${KYB_HEALTH_SLEEP_SECONDS}"
          attempt=1
          while [ "$attempt" -le "$retries" ]; do
            if curl -sf --max-time 5 "${KYB_HEALTH_URL}"; then
              echo
              echo "healthz responded on attempt ${attempt}/${retries}"
              exit 0
            fi
            echo "attempt ${attempt}/${retries}: ${KYB_HEALTH_URL} not ready yet"
            attempt=$((attempt + 1))
            sleep "$sleep_seconds"
          done
          echo "::error::${KYB_HEALTH_URL} did not respond after ${retries} attempts"
          exit 1

      # The service wrapper must reinitialize cleanly when launchd restarts it.
      - name: Restart kyb service and verify keep-alive (bounded retries)
        run: |
          set -euo pipefail
          brew services restart kyb
          retries="${KYB_HEALTH_RETRIES}"
          sleep_seconds="${KYB_HEALTH_SLEEP_SECONDS}"
          attempt=1
          while [ "$attempt" -le "$retries" ]; do
            if curl -sf --max-time 5 "${KYB_HEALTH_URL}"; then
              echo
              echo "healthz responded after service restart on attempt ${attempt}/${retries}"
              exit 0
            fi
            echo "restart attempt ${attempt}/${retries}: ${KYB_HEALTH_URL} not ready yet"
            attempt=$((attempt + 1))
            sleep "$sleep_seconds"
          done
          echo "::error::${KYB_HEALTH_URL} did not recover after service restart"
          exit 1

      # (5) Homebrew var data and index directories must exist and be non-empty.
      - name: Verify Homebrew var data and index directories are non-empty
        run: |
          set -euo pipefail
          var_prefix="$(brew --prefix)/var"
          data_dir="${var_prefix}/kyb/data"
          index_dir="${var_prefix}/kyb/index"
          echo "var prefix: ${var_prefix}"
          ls -la "${var_prefix}" || true
          ls -laR "${var_prefix}/kyb" || true

          if [ ! -d "${data_dir}" ]; then
            echo "::error::kyb data directory missing: ${data_dir}"
            exit 1
          fi
          if [ -z "$(ls -A "${data_dir}")" ]; then
            echo "::error::kyb data directory is empty: ${data_dir}"
            exit 1
          fi
          echo "OK: data directory exists and is non-empty: ${data_dir}"

          if [ ! -d "${index_dir}" ]; then
            echo "::error::kyb index directory missing: ${index_dir}"
            exit 1
          fi
          if [ -z "$(ls -A "${index_dir}")" ]; then
            echo "::error::kyb index directory is empty: ${index_dir}"
            exit 1
          fi
          echo "OK: index directory exists and is non-empty: ${index_dir}"

      # (6) The service wrapper populates these after sandbox-safe install steps.
      - name: Verify agent skills directories after service startup (Claude, Codex, Gemini)
        run: |
          set -euo pipefail
          failed=0

          check_agent_dir() {
            label="$1"
            candidate="$2"
            if [ -d "$candidate" ]; then
              echo "OK: ${label} skills directory '${candidate}' exists"
              ls -la "$candidate" || true
              return 0
            fi
            echo "::error::${label} skills directory missing: ${candidate}"
            return 1
          }

          check_agent_dir "Claude" "$HOME/.claude/skills/kyb" || failed=1
          check_agent_dir "Codex" "$HOME/.codex/skills/kyb" || failed=1
          check_agent_dir "Gemini" "$HOME/.gemini/config/skills/kyb" || failed=1

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more agent skills directories were not created by kyb service initialization"
            exit 1
          fi

      - name: Dump kyb service logs on failure
        if: failure()
        run: |
          set +e
          brew services list
          log_file="$(brew --prefix)/var/log/kyb.log"
          echo "--- ${log_file} ---"
          tail -n 200 "$log_file" 2>/dev/null || echo "no log file at ${log_file}"
          echo "--- HOME dotdirs ---"
          ls -la "$HOME" | grep -E '^d.*\.(claude|codex|gemini)$' || true

      - name: Stop kyb service
        if: always()
        run: |
          set +e
          if command -v brew >/dev/null 2>&1 && brew list --formula --versions kyb >/dev/null 2>&1; then
            brew services stop kyb || true
          else
            echo "Skipping kyb service stop: brew unavailable or formula not installed"
          fi
